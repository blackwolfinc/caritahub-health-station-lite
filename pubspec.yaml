name: health_station_lite
description: "CaritaHub Health Station Lite — pengukuran kesehatan offline dengan cetak struk iMin."
publish_to: 'none'

version: 1.4.0+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bluetooth alat ukur (sama dengan branch health-device)
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.3.1
  squegg_core:
    path: packages/squegg_core

  # Penyimpanan lokal
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Printer thermal bawaan iMin
  imin_printer: ^0.7.5

  # UI & util
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  intl: ^0.20.2
  collection: ^1.18.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # Font dibundel supaya tampilan tetap sama tanpa internet.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400.ttf
          weight: 400
        - asset: assets/fonts/Lexend-500.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
